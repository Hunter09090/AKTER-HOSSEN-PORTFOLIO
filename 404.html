<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Page Not Found — Akter Hossen</title>
    <meta name="theme-color" content="#0B1220">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            background: radial-gradient(circle at center, #17243a, #0b1220 55%, #070c15);
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
        }
        .error { max-width: 600px; }
        .number {
            font-size: clamp(90px, 20vw, 180px);
            line-height: 1;
            font-weight: 900;
            letter-spacing: -8px;
            color: #ffffff;
        }
        .number span { color: #c9a96e; }
        h1 { margin: 25px 0 12px; font-size: 30px; }
        p { color: #94a3b8; line-height: 1.8; }
        a {
            display: inline-flex;
            margin-top: 20px;
            padding: 14px 22px;
            border-radius: 12px;
            background: #ffffff;
            color: #0b1220;
            font-weight: 700;
            text-decoration: none;
            transition: transform 0.3s ease;
        }
        a:hover { transform: translateY(-3px); }
    </style>
</head>
<body>
    <main class="error">
        <div class="number">4<span>0</span>4</div>
        <h1>Page Not Found</h1>
        <p>The page you're looking for doesn't exist or may have been moved.</p>
        <a href="index.html">← Back to Home</a>
    </main>
</body>
</html>
